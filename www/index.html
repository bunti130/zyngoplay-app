<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ZyngoPlay</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">

<div class="logo">
ZyngoPlay
</div>

<div class="wallet">
💰 <span id="coins">100</span> Coins
</div>

</div>


<div class="container">

<div class="game-card">

<div class="game-title">
🎲 Ludo
</div>

<button class="play-btn" onclick="playGame('ludo')">
Play
</button>

</div>


<div class="game-card">

<div class="game-title">
♠ Poker
</div>

<button class="play-btn" onclick="playGame('poker')">
Play
</button>

</div>


<div class="game-card">

<div class="game-title">
🃏 Rummy
</div>

<button class="play-btn" onclick="playGame('rummy')">
Play
</button>

</div>


<div class="game-card">

<div class="game-title">
⚫ Carrom
</div>

<button class="play-btn" onclick="playGame('carrom')">
Play
</button>

</div>

</div>


<div class="footer">

<div>🏠 Home</div>

<div>🎮 Games</div>

<div onclick="openWallet()">💰 Wallet</div>

<div>👤 Profile</div>

</div>


<div id="loading" class="loading">
Finding Player...
</div>


<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script src="app.js"></script>

<script>

function playGame(game){

localStorage.setItem("selectedGame",game)

document.getElementById("loading").style.display="flex"

findMatch(game)

}

</script>

</body>
</html>
