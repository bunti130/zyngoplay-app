<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZyngoPlay</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
margin:0;
padding:0;
}

.header{
background:#000;
padding:20px;
font-size:28px;
color:#00ffcc;
}

.container{
padding:20px;
}

.game{
background:#222;
padding:20px;
margin:15px;
border-radius:10px;
font-size:20px;
}

button{
background:#00ffcc;
border:none;
padding:14px;
border-radius:8px;
font-size:18px;
margin-top:10px;
}

</style>

</head>

<body>

<div class="header">
ZyngoPlay
</div>

<div class="container">

<div class="game">
🎲 Ludo
<br>
<button onclick="openGame('ludo.html')">
Play
</button>
</div>

<div class="game">
♠ Poker
<br>
<button onclick="openGame('poker.html')">
Play
</button>
</div>

<div class="game">
🃏 Rummy
<br>
<button onclick="openGame('rummy.html')">
Play
</button>
</div>

<div class="game">
⚫ Carrom
<br>
<button onclick="openGame('carrom.html')">
Play
</button>
</div>

</div>

<script>

function openGame(page){
window.location = page;
}

</script>

<!-- SOCKET.IO -->

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="app.js"></script>

</body>

</html>
