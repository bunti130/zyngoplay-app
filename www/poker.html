<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

h1{
color:#00ffcc;
margin-top:20px;
}

.table{
width:320px;
height:320px;
background:#222;
margin:30px auto;
border-radius:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.cards{
font-size:40px;
margin-bottom:10px;
}

#bet{
font-size:24px;
margin-top:10px;
}

button{
background:#00ffcc;
border:none;
padding:14px;
border-radius:8px;
font-size:18px;
margin:8px;
}

.back{
background:#444;
}

</style>

</head>

<body>

<h1>Poker Table</h1>

<div class="table">

<div class="cards" id="cards">
🂡 🂡
</div>

<div id="bet">
Bet: 0
</div>

<button onclick="dealCards()">
Deal Cards
</button>

<button onclick="placeBet()">
Place Bet
</button>

</div>

<button class="back" onclick="window.location='index.html'">
Back
</button>

<script>

var bet = 0

var deck = [
"🂡","🂢","🂣","🂤","🂥",
"🂦","🂧","🂨","🂩","🂪",
"🂫","🂭","🂮"
]

function randomCard(){

var r = Math.floor(Math.random()*deck.length)
return deck[r]

}

function dealCards(){

var c1 = randomCard()
var c2 = randomCard()

document.getElementById("cards").innerHTML =
c1 + " " + c2

}

function placeBet(){

bet += 10

document.getElementById("bet").innerHTML =
"Bet: " + bet

}

</script>

</body>

</html>
