<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludo Multiplayer</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

h2{
color:#00ffcc;
}

.board{
width:350px;
margin:20px auto;
display:grid;
grid-template-columns:repeat(11,1fr);
gap:4px;
}

.cell{
background:#333;
padding:10px;
font-size:10px;
border-radius:4px;
}

.token{
background:#00ffcc;
color:black;
}

#dice{
font-size:40px;
margin:10px;
}

button{
background:#00ffcc;
border:none;
padding:12px;
border-radius:6px;
font-size:16px;
margin-top:10px;
}

</style>

</head>

<body>

<h2>Ludo Multiplayer</h2>

<div id="dice">🎲</div>

<div class="board" id="board"></div>

<button onclick="rollDice()">Roll Dice</button>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="app.js"></script>

<script>

let position=0

function createBoard(){

let board=document.getElementById("board")

for(let i=0;i<57;i++){

let cell=document.createElement("div")

cell.className="cell"

cell.id="cell"+i

cell.innerHTML=i+1

board.appendChild(cell)

}

updateToken()

}

function updateToken(){

for(let i=0;i<57;i++){

let c=document.getElementById("cell"+i)

if(c) c.classList.remove("token")

}

let t=document.getElementById("cell"+position)

if(t) t.classList.add("token")

}

function rollDice(){

let number=Math.floor(Math.random()*6)+1

document.getElementById("dice").innerHTML=number

sendMove(number)

}

function updateBoard(data){

position+=data.steps

if(position>56) position=56

updateToken()

}

createBoard()

</script>

</body>

</html>
