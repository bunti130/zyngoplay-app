<!DOCTYPE html>
<html>
<head>

<title>ZyngoPlay Ludo</title>
<link rel="stylesheet" href="style.css">

<style>

body{
background:#0f0f0f;
color:white;
text-align:center;
font-family:Arial;
}

#board{
display:grid;
grid-template-columns:repeat(15,30px);
grid-template-rows:repeat(15,30px);
gap:2px;
justify-content:center;
margin-top:20px;
}

.cell{
width:30px;
height:30px;
background:#222;
}

.red{background:red;}
.blue{background:blue;}
.green{background:green;}
.yellow{background:yellow;}

.token{
width:20px;
height:20px;
border-radius:50%;
margin:auto;
margin-top:5px;
}

.controls{
margin-top:20px;
}

button{
padding:10px 20px;
font-size:16px;
border:none;
border-radius:8px;
background:#00ffc3;
}

</style>

</head>

<body>

<h2>ZyngoPlay Ludo</h2>

<div id="board"></div>

<div class="controls">

<button onclick="rollDice()">Roll Dice</button>

<h3 id="dice">Dice: -</h3>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="app.js"></script>
<script src="ludo.js"></script>

</body>
</html>
