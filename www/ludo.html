<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludo</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

.board{
width:320px;
margin:30px auto;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
}

.cell{
background:#333;
padding:20px;
border-radius:6px;
}

.token{
background:#00ffcc;
}

button{
background:#00ffcc;
border:none;
padding:14px;
border-radius:8px;
font-size:18px;
margin-top:20px;
}

</style>

</head>

<body>

<h2>Ludo Multiplayer</h2>

<div id="dice">🎲</div>

<div class="board" id="board"></div>

<button onclick="rollDice()">Roll Dice</button>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="app.js"></script>

<script>

let position = 0;

function createBoard(){

let board = document.getElementById("board");

for(let i=0;i<25;i++){

let cell=document.createElement("div");

cell.className="cell";

cell.id="cell"+i;

cell.innerHTML=i+1;

board.appendChild(cell);

}

updateToken();

}

function updateToken(){

for(let i=0;i<25;i++){

document.getElementById("cell"+i).classList.remove("token");

}

document.getElementById("cell"+position).classList.add("token");

}

function rollDice(){

let number=Math.floor(Math.random()*6)+1;

document.getElementById("dice").innerHTML=number;

sendMove(number);

}

function updateBoard(data){

position += data.steps;

if(position>24) position=24;

updateToken();

}

createBoard();

</script>

</body>

</html>
