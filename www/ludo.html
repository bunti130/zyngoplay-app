<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ludo Game</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

h1{
color:#00ffcc;
margin-top:20px;
}

.board{
width:320px;
height:320px;
background:#222;
margin:30px auto;
display:grid;
grid-template-columns:repeat(3,1fr);
grid-gap:6px;
}

.cell{
background:#333;
padding:35px;
border-radius:8px;
}

#dice{
font-size:50px;
margin-top:10px;
}

button{
background:#00ffcc;
border:none;
padding:14px;
border-radius:8px;
font-size:18px;
margin-top:20px;
}

.back{
background:#444;
}

</style>

</head>

<body>

<h1>Ludo Game</h1>

<div id="dice">
🎲
</div>

<div class="board">

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

</div>

<button onclick="rollDice()">
Roll Dice
</button>

<br>

<button class="back" onclick="window.location='index.html'">
Back to Lobby
</button>

<script>

function rollDice(){

var number = Math.floor(Math.random()*6)+1;

document.getElementById("dice").innerHTML = number;

}

</script>

</body>

</html>
