<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ludo Game</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

h1{
color:#00ffcc;
}

#board{
display:grid;
grid-template-columns:repeat(10,40px);
grid-gap:4px;
justify-content:center;
margin-top:20px;
}

.cell{
width:40px;
height:40px;
background:#333;
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
}

.player{
background:#00ffcc;
color:black;
font-weight:bold;
}

button{
margin-top:20px;
padding:15px;
font-size:18px;
background:#00ffcc;
border:none;
border-radius:8px;
}

</style>

</head>

<body>

<h1>Ludo Match</h1>

<div id="board"></div>

<button onclick="rollDice()">Roll Dice</button>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="app.js"></script>

<script>

const board=document.getElementById("board")

let cells=[]

for(let i=0;i<100;i++){

const cell=document.createElement("div")
cell.className="cell"
cell.innerText=i

board.appendChild(cell)

cells.push(cell)

}

function rollDice(){

const dice=Math.floor(Math.random()*6)+1

sendMove(dice)

}

function updateBoard(data){

const positions=data.positions

cells.forEach(c=>{
c.classList.remove("player")
})

for(let player in positions){

let pos=positions[player]

if(cells[pos]){

cells[pos].classList.add("player")
cells[pos].innerText="P"

}

}

}

</script>

</body>
</html>
