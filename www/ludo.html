<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludo Multiplayer</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

.board{
width:360px;
margin:20px auto;
display:grid;
grid-template-columns:repeat(11,1fr);
gap:4px;
}

.cell{
background:#333;
padding:10px;
border-radius:4px;
font-size:10px;
}

.safe{
background:#444;
}

.token{
background:#00ffcc;
color:black;
}

#dice{
font-size:40px;
margin:10px;
}

button{
background:#00ffcc;
border:none;
padding:12px;
border-radius:6px;
font-size:16px;
margin-top:10px;
}

</style>

</head>

<body>

<h2>Ludo Multiplayer</h2>

<div id="dice">🎲</div>

<div id="board" class="board"></div>

<button onclick="rollDice()">Roll Dice</button>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="app.js"></script>

<script>

let tokens={
p1:0,
p2:0
}

let safeZones=[0,8,13,21,26,34,39,47]

function createBoard(){

let board=document.getElementById("board")

for(let i=0;i<57;i++){

let cell=document.createElement("div")

cell.className="cell"

if(safeZones.includes(i)){
cell.classList.add("safe")
}

cell.id="cell"+i
cell.innerHTML=i+1

board.appendChild(cell)

}

updateBoard()

}

function updateBoard(){

for(let i=0;i<57;i++){

let c=document.getElementById("cell"+i)

if(c){
c.innerHTML=i+1
}

}

document.getElementById("cell"+tokens.p1).innerHTML="🔵"
document.getElementById("cell"+tokens.p2).innerHTML="🔴"

}

function rollDice(){

let dice=Math.floor(Math.random()*6)+1

document.getElementById("dice").innerHTML=dice

sendMove(dice)

}

function updateBoard(data){

tokens.p1+=data.steps

if(tokens.p1>56){
tokens.p1=56
}

if(tokens.p1===tokens.p2 && !safeZones.includes(tokens.p1)){

tokens.p2=0

alert("Player killed!")

}

updateBoard()

}

createBoard()

</script>

</body>

</html>
