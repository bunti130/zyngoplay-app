<!DOCTYPE html>
<html>

<head>

<title>ZyngoPlay Ludo</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#0f0f0f;
color:white;
font-family:Arial;
text-align:center;
}

#ludoBoard{
width:360px;
height:360px;
margin:auto;
display:grid;
grid-template-columns:repeat(15,1fr);
grid-template-rows:repeat(15,1fr);
border:4px solid white;
}

.cell{
border:1px solid #333;
display:flex;
align-items:center;
justify-content:center;
}

.red{background:#ff4d4d;}
.green{background:#2ecc71;}
.blue{background:#3498db;}
.yellow{background:#f1c40f;}

.home{
border-radius:8px;
}

.token{
width:18px;
height:18px;
border-radius:50%;
background:white;
}

.controls{
margin-top:20px;
}

button{
padding:10px 20px;
font-size:16px;
border:none;
border-radius:6px;
background:#00ffc3;
}

</style>

</head>

<body>

<h2>ZyngoPlay Ludo</h2>

<div id="ludoBoard"></div>

<div class="controls">

<button onclick="rollDice()">Roll Dice</button>

<h3 id="dice">Dice:</h3>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>

const board=document.getElementById("ludoBoard")

for(let i=0;i<225;i++){

let cell=document.createElement("div")

cell.className="cell"

board.appendChild(cell)

}

</script>

<script src="app.js"></script>
<script src="ludo.js"></script>

</body>

</html>
