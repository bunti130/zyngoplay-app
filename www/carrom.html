<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrom</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

h1{
color:#00ffcc;
margin-top:20px;
}

.board{
width:320px;
height:320px;
background:#d8a45c;
margin:30px auto;
border-radius:12px;
position:relative;
}

.coin{
width:28px;
height:28px;
border-radius:50%;
position:absolute;
}

.black{
background:black;
}

.white{
background:white;
}

.red{
background:red;
}

#score{
font-size:22px;
margin-top:10px;
}

button{
background:#00ffcc;
border:none;
padding:14px;
border-radius:8px;
font-size:18px;
margin-top:10px;
}

.back{
background:#444;
}

</style>

</head>

<body>

<h1>Carrom Board</h1>

<div class="board" id="board">

</div>

<div id="score">
Score: 0
</div>

<button onclick="potCoin()">
Pot Coin
</button>

<br>

<button class="back" onclick="window.location='index.html'">
Back
</button>

<script>

var score = 0

function createCoins(){

var board = document.getElementById("board")

for(let i=0;i<9;i++){

var coin = document.createElement("div")
coin.className = "coin black"

coin.style.left = Math.random()*280 + "px"
coin.style.top = Math.random()*280 + "px"

board.appendChild(coin)

}

}

function potCoin(){

score++

document.getElementById("score").innerHTML =
"Score: " + score

}

createCoins()

</script>

</body>

</html>
