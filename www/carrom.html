<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrom Multiplayer</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

canvas{
background:#d8b36a;
border:8px solid #5a3a14;
margin-top:20px;
}

button{
background:#00ffcc;
border:none;
padding:10px;
border-radius:6px;
margin:5px;
font-size:16px;
}

#info{
margin-top:10px;
font-size:18px;
color:#00ffcc;
}

</style>

</head>

<body>

<h2>Carrom Board</h2>

<canvas id="board" width="340" height="340"></canvas>

<div id="info">
Player1 : 0 | Player2 : 0
</div>

<button onclick="shoot()">Shoot</button>
<button onclick="resetBoard()">Reset Board</button>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="app.js"></script>

<script>

const canvas=document.getElementById("board")
const ctx=canvas.getContext("2d")

let striker
let coins

let p1=0
let p2=0
let turn=1

function setupBoard(){

striker={x:170,y:300,r:10,dx:0,dy:0}

coins=[
{x:170,y:150,r:8,color:"black"},
{x:150,y:170,r:8,color:"white"},
{x:190,y:170,r:8,color:"white"},
{x:150,y:130,r:8,color:"black"},
{x:190,y:130,r:8,color:"black"},
{x:170,y:170,r:8,color:"red",queen:true}
]

}

setupBoard()

function drawCircle(x,y,r,color){

ctx.beginPath()
ctx.arc(x,y,r,0,Math.PI*2)
ctx.fillStyle=color
ctx.fill()

}

function drawBoard(){

ctx.clearRect(0,0,340,340)

drawCircle(striker.x,striker.y,striker.r,"blue")

coins.forEach(c=>{
drawCircle(c.x,c.y,c.r,c.color)
})

}

function update(){

striker.x+=striker.dx
striker.y+=striker.dy

striker.dx*=0.98
striker.dy*=0.98

coins.forEach((c,i)=>{

let dist=Math.hypot(c.x-striker.x,c.y-striker.y)

if(dist<18){

if(c.queen){

if(turn===1)p1+=3
else p2+=3

}else{

if(turn===1)p1++
else p2++

}

coins.splice(i,1)

updateScore()

turn=turn===1?2:1

sendMove("pot")

}

})

checkWinner()

}

function updateScore(){

document.getElementById("info").innerHTML=
"Player1 : "+p1+" | Player2 : "+p2

}

function checkWinner(){

if(coins.length===0){

let winner=p1>p2?"Player1 Wins":"Player2 Wins"

document.getElementById("info").innerHTML=winner

}

}

function shoot(){

striker.dx=(Math.random()*8)-4
striker.dy=-6

sendMove("shoot")

}

function resetBoard(){

setupBoard()

p1=0
p2=0

updateScore()

}

function loop(){

update()
drawBoard()

requestAnimationFrame(loop)

}

loop()

</script>

</body>

</html>
