<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZyngoPlay Room</title><link rel="stylesheet" href="style.css"><style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

.header{
background:#000;
padding:20px;
font-size:26px;
color:#00ffcc;
}

.container{
padding:30px;
}

.player{
background:#222;
margin:10px;
padding:15px;
border-radius:8px;
font-size:18px;
}

</style></head><body><div class="header">
ZyngoPlay Match Room
</div><div class="container"><div class="player" id="player1">
Waiting for player...
</div><div class="player" id="player2">
Waiting for player...
</div><p id="status">Connecting to server...</p></div><script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script><script>

const socket = io("https://zyngoplay-server.onrender.com",{
transports:["websocket"]
})

const game = localStorage.getItem("selectedGame")

socket.on("connect",()=>{
document.getElementById("status").innerText="Waiting for opponent..."
})

socket.on("match_found",(data)=>{

document.getElementById("player1").innerText="Player 1 Connected"
document.getElementById("player2").innerText="Player 2 Connected"

document.getElementById("status").innerText="Match Found!"

localStorage.setItem("roomId",data.room)

setTimeout(()=>{

window.location.href = game + ".html"

},1500)

})

</script></body>
</html>
