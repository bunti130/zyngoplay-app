<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rummy Game</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

h1{
color:#00ffcc;
margin-top:20px;
}

.table{
width:350px;
margin:30px auto;
background:#222;
padding:20px;
border-radius:10px;
}

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
font-size:32px;
}

.card{
margin:6px;
}

button{
background:#00ffcc;
border:none;
padding:14px;
border-radius:8px;
font-size:18px;
margin-top:15px;
}

.back{
background:#444;
}

</style>

</head>

<body>

<h1>Rummy Table</h1>

<div class="table">

<div id="cards" class="cards">

</div>

<button onclick="dealCards()">
Deal 13 Cards
</button>

</div>

<button class="back" onclick="window.location='index.html'">
Back to Lobby
</button>

<script>

var deck=[
"🂡","🂢","🂣","🂤","🂥","🂦","🂧","🂨","🂩","🂪","🂫","🂭","🂮",
"🂱","🂲","🂳","🂴","🂵","🂶","🂷","🂸","🂹","🂺","🂻","🂽","🂾"
]

function randomCard(){
var r=Math.floor(Math.random()*deck.length)
return deck[r]
}

function dealCards(){

var container=document.getElementById("cards")

container.innerHTML=""

for(let i=0;i<13;i++){

var card=document.createElement("div")
card.className="card"

card.innerHTML=randomCard()

container.appendChild(card)

}

}

</script>

</body>

</html>
