<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rummy Multiplayer</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

.table{
width:360px;
margin:20px auto;
background:#1a1a1a;
padding:20px;
border-radius:10px;
}

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
font-size:32px;
margin:10px;
}

.card{
margin:4px;
}

button{
background:#00ffcc;
border:none;
padding:12px;
border-radius:6px;
font-size:16px;
margin:6px;
}

#discard{
margin-top:10px;
font-size:28px;
}

</style>

</head>

<body>

<h2>Rummy Multiplayer</h2>

<div class="table">

<div>Your Cards</div>

<div id="hand" class="cards"></div>

<div>
Discard Pile
</div>

<div id="discard">
🂠
</div>

<button onclick="deal()">Deal 13 Cards</button>

<button onclick="draw()">Draw Card</button>

<button onclick="discard()">Discard</button>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="app.js"></script>

<script>

let deck=[
"🂡","🂢","🂣","🂤","🂥","🂦","🂧","🂨","🂩","🂪","🂫","🂭","🂮",
"🂱","🂲","🂳","🂴","🂵","🂶","🂷","🂸","🂹","🂺","🂻","🂽","🂾"
]

let hand=[]
let discardCard="🂠"

function randomCard(){

let r=Math.floor(Math.random()*deck.length)

return deck[r]

}

function deal(){

hand=[]

for(let i=0;i<13;i++){

hand.push(randomCard())

}

render()

}

function draw(){

let card=randomCard()

hand.push(card)

render()

sendMove(1)

}

function discard(){

if(hand.length===0)return

discardCard=hand.pop()

document.getElementById("discard").innerHTML=discardCard

render()

sendMove(2)

}

function render(){

let container=document.getElementById("hand")

container.innerHTML=""

hand.forEach(c=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=c

container.appendChild(div)

})

}

</script>

</body>

</html>
