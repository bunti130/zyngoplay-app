<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ZyngoPlay</title>

<style>

body{
margin:0;
background:#0f0f0f;
color:white;
font-family:Arial;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:#1a1a1a;
}

.logo{
font-size:20px;
font-weight:bold;
color:#00ffc3;
}

.wallet{
font-size:14px;
}

.profile{
font-size:14px;
}

.container{
padding:15px;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.game-card{
background:#1e1e1e;
padding:15px;
border-radius:10px;
text-align:center;
}

.game-title{
font-size:18px;
margin-bottom:10px;
}

.play-btn{
background:#00ffc3;
border:none;
padding:8px 15px;
border-radius:6px;
font-weight:bold;
}

.match-box{
background:#1e1e1e;
margin:15px;
padding:15px;
border-radius:10px;
}

.match-row{
display:flex;
justify-content:space-between;
margin-top:8px;
}

.join-btn{
background:#ffcc00;
border:none;
padding:6px 12px;
border-radius:5px;
}

.footer{
position:fixed;
bottom:0;
width:100%;
background:#1a1a1a;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000dd;
display:none;
justify-content:center;
align-items:center;
font-size:20px;
}

</style>

</head>

<body>

<div class="header">

<div class="logo">
ZyngoPlay
</div>

<div class="wallet">
💰 <span id="coins">100</span> Coins
</div>

<div class="profile">
👤 Player
</div>

</div>


<div class="container">

<div class="game-card">
<div class="game-title">🎲 Ludo</div>
<button class="play-btn" onclick="playGame('ludo')">Play</button>
</div>

<div class="game-card">
<div class="game-title">🃏 Poker</div>
<button class="play-btn" onclick="playGame('poker')">Play</button>
</div>

<div class="game-card">
<div class="game-title">🂡 Rummy</div>
<button class="play-btn" onclick="playGame('rummy')">Play</button>
</div>

<div class="game-card">
<div class="game-title">⚫ Carrom</div>
<button class="play-btn" onclick="playGame('carrom')">Play</button>
</div>

</div>


<div class="match-box">

<b>Quick Match</b>

<div class="match-row">
<div>Ludo Entry</div>
<div>10 Coins</div>
<button class="join-btn" onclick="joinQueue('ludo',10)">Join</button>
</div>

<div class="match-row">
<div>Poker Entry</div>
<div>20 Coins</div>
<button class="join-btn" onclick="joinQueue('poker',20)">Join</button>
</div>

<div class="match-row">
<div>Rummy Entry</div>
<div>15 Coins</div>
<button class="join-btn" onclick="joinQueue('rummy',15)">Join</button>
</div>

</div>


<div class="footer">

<div>🏠 Home</div>

<div>🎮 Games</div>

<div onclick="openWallet()">💰 Wallet</div>

<div>👤 Profile</div>

</div>


<div id="loading" class="loading">
Finding Player...
</div>


<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>


const socket = io("https://zyngoplay-server.onrender.com",{
transports:["websocket"]
})


function playGame(game){

localStorage.setItem("selectedGame",game)

window.location.href = game + ".html"

}


function joinQueue(game,fee){

let coins=parseInt(document.getElementById("coins").innerText)

if(coins<fee){

alert("Not enough coins")

return

}

document.getElementById("loading").style.display="flex"

socket.emit("find_match",{

userId:Date.now(),

game:game

})

}


socket.on("match_found",(data)=>{

document.getElementById("loading").style.display="none"

localStorage.setItem("roomId",data.room)

window.location.href = data.game + ".html"

})


function openWallet(){

alert("Wallet system coming soon")

}

</script>

</body>
</html>
