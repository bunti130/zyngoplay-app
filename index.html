<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZyngoPlay</title><style>

body{
margin:0;
background:#0f0f0f;
color:white;
font-family:Arial;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:#1a1a1a;
}

.logo{
font-size:20px;
font-weight:bold;
color:#00ffc3;
}

.wallet{
font-size:14px;
}

.profile{
font-size:14px;
}

/* GAME GRID */

.container{
padding:15px;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.game-card{
background:#1e1e1e;
padding:15px;
border-radius:10px;
text-align:center;
}

.game-title{

}

.play-btn{
background:#00ffc3;
border:none;
padding:8px 15px;

font-weight:bold;
}

/* MATCHMAKING */

.match-box{
background:#1e1e1e;
margin:15px;
padding:15px;
border-radius:10px;
}

.match-row{
display:flex;
justify-content:space-between;
margin-top:8px;
}

.join-btn{
background:#ffcc00;
border:none;
padding:6px 12px;
border-radius:5px;
}

/* FOOTER */

.footer{
position:fixed;
bottom:0;
width:100%;
background:#1a1a1a;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.footer div{
font-size:14px;
}

/* LOADING */

.loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000dd;
display:none;
justify-content:center;
align-items:center;
font-size:20px;
}

</style></head><body><!-- HEADER --><div class="header"><div class="logo">

</div><div class="wallet">

</div><div class="profile">

</div></div><!-- GAME LIST --><div class="container"><div class="game-card">
<div class="game-title">ðŸŽ² Ludo</div>
<button class="play-btn" onclick="playGame('ludo')">Play</button>
</div><div class="game-card">
<div class="game-title">â™  Poker</div>
<button class="play-btn" onclick="playGame('poker')">Play</button>
</div><div class="game-card">
<div class="game-title">ðŸƒ Rummy</div>

</div></div><!-- MATCHMAKING --><div class="match-box"><div><b>Quick Match</b></div><div class="match-row">

</div><script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script><script>

/* ======================
   SOCKET CONNECT
====================== */

let socket = io("https://zyngoplay-server.onrender.com",{
 transports:["websocket"]
})

/* ======================
   PLAY GAME
====================== */

function playGame(game){

localStorage.setItem("selectedGame",game)

window.location=game+".html"

}

/* ======================
   MATCHMAKING
====================== */

function joinQueue(game,fee){

let coins=parseInt(document.getElementById("coins").innerText)

if(coins<fee){

alert("Not enough coins")
return

}

document.getElementById("loading").style.display="flex"

socket.emit("join_queue",{
game:game,
fee:fee
})

}

/* ======================
   MATCH FOUND
====================== */

socket.on("match_found",(data)=>{

document.getElementById("loading").style.display="none"

localStorage.setItem("roomId",data.room)

window.location=data.game+".html"

})

/* ======================
   WALLET
====================== */

function openWallet(){

alert("Wallet system coming soon")

}

</script></body>
</html>
